<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazy Load Images</title>
  <link rel="stylesheet" href="styles/lazyload.css">
</head>
<body>
  <main>
    <h1>Lazy Loaded Gallery</h1>

    <img
      src="https://picsum.photos/id/10/400/600"
      alt="Forest path"
      width="400"
      height="600"
      loading="lazy"
      class="fade-in">

    <img
      src="https://picsum.photos/id/20/400/600"
      alt="Mountain lake"
      width="400"
      height="600"
      loading="lazy"
      class="fade-in">

    <img
      src="https://picsum.photos/id/30/400/600"
      alt="Ocean waves"
      width="400"
      height="600"
      loading="lazy"
      class="fade-in">

    <img
      src="https://picsum.photos/id/40/400/600"
      alt="Desert landscape"
      width="400"
      height="600"
      loading="lazy"
      class="fade-in">

    <img
      src="https://picsum.photos/id/50/400/600"
      alt="City skyline"
      width="400"
      height="600"
      loading="lazy"
      class="fade-in">

    <img
      src="https://picsum.photos/id/60/400/600"
      alt="Snowy peaks"
      width="400"
      height="600"
      loading="lazy"
      class="fade-in">
  </main>

  <footer>
    <p>&copy; 2026 Mike | Last Modified: <span id="last-modified"></span></p>
  </footer>

  <script src="scripts/lazyload.js"></script>
</body>
</html>
